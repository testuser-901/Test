<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | GAURAV AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="auth">
  <header class="container">
    <nav class="navbar">
      <a class="logo" href="index.html">GAURAV AI</a>
      <div class="nav-links">
        <a href="login.html" class="btn btn-outline">Login</a>
      </div>
    </nav>
  </header>

  <main class="container auth-wrapper">
    <div class="glass-card auth-card">
      <h2>Create your account</h2>
      <p>Join GAURAV AI and unlock premium courses.</p>
      <form id="signup-form">
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" minlength="6" placeholder="Minimum 6 characters" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign Up</button>
      </form>
      <p style="margin-top: 16px;">
        Already have an account? <a class="helper-link" href="login.html">Login</a>
      </p>
    </div>
  </main>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
  </div>
  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="auth.js"></script>
</body>
</html>
