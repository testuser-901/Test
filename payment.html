<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment | GAURAV AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="protected">
  <header class="container">
    <nav class="navbar">
      <a class="logo" href="index.html">GAURAV AI</a>
      <div class="nav-links">
        <a href="dashboard.html" class="btn btn-outline">Back to Dashboard</a>
      </div>
    </nav>
  </header>

  <main class="container auth-wrapper">
    <div class="glass-card payment-card">
      <h2>Complete your enrollment</h2>
      <p class="welcome">Secure payment will be enabled soon.</p>
      <div class="qr-placeholder">QR / UPI Placeholder</div>
      <p>Razorpay integration will be added later.</p>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-analytics.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgiM5aNDDJhFHGG9-eK-lwAEPM3u4w448",
      authDomain: "sign-in-ae5ca.firebaseapp.com",
      projectId: "sign-in-ae5ca",
      storageBucket: "sign-in-ae5ca.firebasestorage.app",
      messagingSenderId: "976958705327",
      appId: "1:976958705327:web:d99ebeeb72154797d34e5a",
      measurementId: "G-66LVVCPBZ7"
    };

    const app = initializeApp(firebaseConfig);
    getAnalytics(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      }
    });
  </script>
</body>
</html>
